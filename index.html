<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOMA - Future of Decor</title>
    <meta name="description" content="Pitch deck for HOMA AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Vazirmatn', 'sans-serif'],
            },
            colors: {
              // Uber-like Monochrome Scale
              brand: {
                50: '#fafafa',
                100: '#f4f4f5',
                500: '#71717a',
                600: '#ffffff', // Primary Brand is White now
                900: '#18181b',
              },
              // Accent color (Subtle Blue/Teal for data)
              accent: {
                400: '#38bdf8', // Sky blue for emphasis
                500: '#0ea5e9',
              }
            },
            animation: {
              'wiggle': 'wiggle 2s ease-in-out infinite',
              'draw': 'dash 2s ease-out forwards',
              'float': 'float 3s ease-in-out infinite',
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-1deg)' },
                '50%': { transform: 'rotate(1deg)' },
              },
              dash: {
                'to': { strokeDashoffset: '0' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Vazirmatn', sans-serif;
        overflow: hidden; /* Prevent scrolling, treat like a slide deck */
        background-color: #000000;
        color: #ffffff;
      }
      .slide-enter {
        opacity: 0;
        transform: scale(0.98);
      }
      .slide-enter-active {
        opacity: 1;
        transform: scale(1);
        transition: opacity 500ms ease-in-out, transform 500ms ease-in-out;
      }
      /* Custom scrollbar hiding */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      
      /* Hand-drawn effect classes */
      .ink-stroke {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 3s ease-out forwards;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      
      .wobbly {
        animation: wiggle 3s ease-in-out infinite;
      }
      
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes wiggle {
        0%, 100% { transform: scale(1) rotate(-0.5deg); }
        50% { transform: scale(1.01) rotate(0.5deg); }
      }
      
      @keyframes scribble {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }

      .animate-scribble {
        animation: scribble 0.5s steps(10) infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-black text-white h-screen w-screen selection:bg-white selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
