version: '3.8'

services:
  homa-pitch-deck:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
